# NAS 部署 — 单镜像（web+api+scrape），两套独立 Postgres（均不进本 compose）
#
# 目录:
#   /vol1/1000/Docker/sehua-next-web/
#     docker-compose.yml
#     data/
#     scrape-data/
#     config/
#       app.json              # 仓库公开默认（可从本仓库拷）
#       app.local.json        # 本机敏感项：两套 DSN / 代理 / 密钥（勿提交）
#
# 两套库（局域网直连，勿用 127.0.0.1 / 勿用容器名）:
#   色花资源库   resource_db     例 192.168.2.38:5435/ed2k
#   Bitmagnet    bitmagnet_db    例 192.168.2.38:5438/bitmagnet
# 也可启动后在 设置 → 资源数据库 / Bitmagnet 库 填写。
#
# 启动:
#   mkdir -p /vol1/1000/Docker/sehua-next-web/{data,scrape-data,config}
#   cd /vol1/1000/Docker/sehua-next-web
#   docker compose pull
#   docker compose up -d
# 访问: http://NAS_IP:3020

name: sehua-next-web

services:
  app:
    image: poillysky/sehua-next-web:latest
    container_name: sehua-next-web
    restart: always
    ports:
      - "3020:3020"
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      SCRAPE_ORIGIN: http://127.0.0.1:9210
      API_INTERNAL_BASE: http://127.0.0.1:8020
      WEB_PORT: "3020"
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/scrape-data:/app/apps/scrape/data
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
