# NAS 部署 — 单镜像（web + api），Postgres 独立（不进本 compose）
#
# 目录:
#   /vol1/1000/Docker/sehua-next-web/
#     docker-compose.yml
#     data/
#     config/
#       app.json / app.local.json
#
# 刮削改由外部 MDC-ng 写入 library；本镜像不再内置 scrape Worker。
#
# 启动:
#   mkdir -p /vol1/1000/Docker/sehua-next-web/{data,config}
#   cd /vol1/1000/Docker/sehua-next-web && docker compose pull && docker compose up -d
# 访问: http://NAS_IP:3020

name: sehua-next-web

services:
  app:
    image: poillysky/sehua-next-web:latest
    container_name: sehua-next-web
    restart: always
    mem_limit: 1024m
    ports:
      - "3020:3020"
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      API_INTERNAL_BASE: http://127.0.0.1:8020
      WEB_PORT: "3020"
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
