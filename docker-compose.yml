# NAS 部署 — UI(Web+API) + 刮削 Worker + Postgres（pgvector）
#
# 目录:
#   /vol1/1000/Docker/sehua-next-web/
#     docker-compose.yml
#     data/              → /app/data（本地缓存等）
#     media/             → /app/media（strm-library / scrap-library）
#     postgres/          → Postgres 数据（库名 nextweb）
#     config/
#       app.json / app.local.json
#
# 启动:
#   mkdir -p /vol1/1000/Docker/sehua-next-web/{data,media,postgres,config}
#   cd /vol1/1000/Docker/sehua-next-web && docker compose pull && docker compose up -d
# 访问: http://NAS_IP:3020
# Postgres 对外: NAS_IP:5439（库名 nextweb）
#
# 片商刮削库: media/scrap-library/
# 重活（扫描/刮削/向量化）在 scrape-worker；UI 容器优先保持流畅。
# 需使用含 APP_ROLE / supervisord-worker 的镜像（重新 build/push 后部署）。

name: sehua-next-web

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: sehua-next-web-postgres
    restart: always
    # ⚠️ 2026-09-21 20:41:44 本容器重启过一次（对外 5439 在 20:38–20:41 之间
    # refused/timeout 交替约 3 分钟，pg_postmaster_start_time() 正是 20:41:44）。
    # 根因高度指向「临时文件写爆盘」而非断电：pg_stat_database 显示
    # temp_files=12,948、temp_bytes≈442GB，而 work_mem 只有 4MB、
    # 且 temp_file_limit=0（不限额）——单条排序/哈希查询就能把数据卷写满，
    # PG 落盘失败即 PANIC 退出，restart:always 再把它拉起来，
    # 对外表现就是「抖几分钟后自己好了」。
    # 下面显式覆盖参数止血：提高 work_mem 减少落盘，并给单会话临时文件设上限
    # （超限直接报错，而不是写满 NAS 卷把实例拖崩）。
    # ⚠️ 内存上限 2G 偏紧（shared_buffers + 并发 work_mem + autovacuum）；
    # 若 NAS 余量充足建议提到 3~4G，并单独监控数据卷剩余空间。
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=192MB
      # 单会话临时文件上限：超限报错，不再默默写满数据卷
      - -c
      - temp_file_limit=16GB
      # 崩溃前留证：记录 >=256MB 的临时文件与 >=3s 的语句
      - -c
      - log_temp_files=262144
      - -c
      - log_min_duration_statement=3000
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextweb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - /vol1/1000/Docker/sehua-next-web/postgres:/var/lib/postgresql/data
    shm_size: 1g
    sysctls:
      - kernel.shmmax=1073741824
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextweb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  scrape-worker:
    image: poillysky/sehua-next-web:1.2.21
    container_name: sehua-next-web-scrape
    restart: always
    # 刮削吞吐：4G mid 档；上限非预占，任务结束后会回落。
    mem_limit: 4g
    memswap_limit: 4g
    cpu_shares: 512
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8020"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      SNS_META_DSN: postgresql://postgres:postgres@postgres:5432/nextweb
      APP_ROLE: worker
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/media:/app/media
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  app:
    image: poillysky/sehua-next-web:1.2.21
    container_name: sehua-next-web
    restart: always
    # UI 优先：轻量上限，空闲不预占。
    mem_limit: 2g
    memswap_limit: 2g
    cpu_shares: 1024
    depends_on:
      postgres:
        condition: service_healthy
      scrape-worker:
        condition: service_healthy
    ports:
      - "3020:3020"
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      SNS_META_DSN: postgresql://postgres:postgres@postgres:5432/nextweb
      APP_ROLE: ui
      SCRAPE_WORKER_URL: http://scrape-worker:8020
      API_INTERNAL_BASE: http://127.0.0.1:8020
      WEB_PORT: "3020"
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/media:/app/media
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
