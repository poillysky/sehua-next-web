# NAS 部署（对齐 sehua / sehuatang-search）
#
# 目录:
#   /vol1/1000/Docker/sehua-next-web/
#     docker-compose.yml
#     data/           # SQLite / library / maker-fs
#     scrape-data/    # 刮削封面与 meta
#     config/         # app.json 管理员种子等
#
# 前提：主栈已 up，且存在外部网络 sehuatang-network（见 sehua docker-compose.nas.yml）。
# 设置 → 资源库 DSN 示例（容器内访问主栈 Postgres）:
#   主机 postgres · 端口 5432 · 库 ed2k
#   勿填 127.0.0.1（那是容器自己）
#
# 启动:
#   cd /vol1/1000/Docker/sehua-next-web
#   docker compose pull
#   docker compose up -d
# 访问: http://NAS_IP:3020

name: sehua-next-web

services:
  app:
    image: poillysky/sehua-next-web:1.0.0
    container_name: sehua-next-web
    restart: always
    ports:
      - "3020:3020"
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      SCRAPE_ORIGIN: http://127.0.0.1:9210
      API_INTERNAL_BASE: http://127.0.0.1:8020
      WEB_PORT: "3020"
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/scrape-data:/app/apps/scrape/data
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8

networks:
  default:
    name: sehuatang-network
    external: true
