# NAS 部署 — 独立服务（资源库 Postgres 另机/另容器）
#
# 目录:
#   /vol1/1000/Docker/sehua-next-web/
#     docker-compose.yml
#     data/           # SQLite / library / maker-fs
#     scrape-data/    # 刮削封面与 meta
#     config/         # app.json（默认含独立资源库 DSN）
#
# 资源库：与本服务无关，用局域网可达地址（勿用 127.0.0.1 / 勿用容器名 postgres）。
# 默认见 config/app.json → settings.resource_db
#   例: postgresql://postgres:postgres@192.168.2.38:5435/ed2k
#
# 启动:
#   cd /vol1/1000/Docker/sehua-next-web
#   docker compose pull
#   docker compose up -d
# 访问: http://NAS_IP:3020

name: sehua-next-web

services:
  app:
    image: poillysky/sehua-next-web:1.0.1
    container_name: sehua-next-web
    restart: always
    ports:
      - "3020:3020"
    environment:
      TZ: Asia/Shanghai
      SNS_COOKIE_SECURE: "0"
      SCRAPE_ORIGIN: http://127.0.0.1:9210
      API_INTERNAL_BASE: http://127.0.0.1:8020
      WEB_PORT: "3020"
    volumes:
      - /vol1/1000/Docker/sehua-next-web/data:/app/data
      - /vol1/1000/Docker/sehua-next-web/scrape-data:/app/apps/scrape/data
      - /vol1/1000/Docker/sehua-next-web/config:/app/config
    dns:
      - 223.5.5.5
      - 8.8.8.8
    # 独立网桥即可；经宿主机/局域网访问外部 Postgres（如 192.168.2.38:5435）
    extra_hosts:
      - "host.docker.internal:host-gateway"
