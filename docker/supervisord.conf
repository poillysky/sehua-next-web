[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8020
directory=/app/apps/api
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scrape]
command=/app/apps/scrape/node_modules/.bin/tsx src/index.ts
directory=/app/apps/scrape
environment=PORT="9210",HOST="127.0.0.1",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app/web
environment=PORT="%(ENV_WEB_PORT)s",HOSTNAME="0.0.0.0",NODE_ENV="production",API_INTERNAL_BASE="http://127.0.0.1:8020",NEXT_PUBLIC_API_BASE="/api"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
